# ResellRadar - single-node pseudo-distributed HDFS (Person 1, real cluster)
#
# Official Apache Hadoop 3.4.1 image: apache/hadoop:3
#   - namenode : HDFS master  (RPC 9000, WebHDFS/Web UI 9870)
#   - datanode : HDFS worker  (data transfer 9866, Web UI 9864)
#
# Team contract honored in docker/hadoop/hdfs-site.xml:
#   dfs.replication = 1, dfs.blocksize = 67,108,864 (64 MB)
#
# Raw-zone data is uploaded via WebHDFS from the host (scripts/push_to_hdfs.py);
# persistence lives in named volumes hdfs_namenode / hdfs_datanode.
#
# Distributed batch processing (Spark Standalone cluster, opt-in via the "cluster"
# profile so the default stack stays storage-only):
#   docker compose -f docker-compose.yml --profile cluster up -d --scale spark-worker=3
#   then submit jobs with:  CLUSTER=1 scripts/run_stage_in_docker.sh <spark_jobs/xxx.py>
#   spark-master : distributes tasks (RPC 7077, Web UI 8080)
#   spark-worker : one JVM executor host per replica (scaled with --scale); the repo
#                  is bind-mounted read-only at /work so executors can import job modules
#
# Usage (from the project root):
#   docker compose -f docker-compose.yml up -d
#   # wait for a healthy DataNode, then:
#   python scripts/push_to_hdfs.py
#   docker exec resellradar-namenode hdfs dfsadmin -report   # live proof

services:
  namenode:
    image: apache/hadoop:3
    container_name: resellradar-namenode
    hostname: namenode
    user: root
    # format the NameNode storage once (idempotent), then start
    command: ["/bin/bash", "-c", "if [ ! -f /hadoop/dfs/name/current/VERSION ]; then hdfs namenode -format -nonInteractive; fi; exec hdfs namenode"]
    environment:
      EFS_NAME: HDFS
    ports:
      - "9870:9870"   # NameNode Web UI / WebHDFS
      - "9000:9000"   # HDFS RPC
    volumes:
      - hdfs_namenode:/hadoop/dfs/name
      - ./docker/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./docker/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    healthcheck:
      # "NameNode RPC answers?" - NOT "safemode OFF".
      # The old check (`-safemode get | grep -q OFF`) deadlocked every restart with data on
      # disk: safemode lifts only after a DataNode's block report, while the DataNode
      # waits below on service_healthy. `-report` answers even in safe mode, which is
      # exactly the dependency the DataNode needs (RPC reachable). First start formats
      # with zero blocks, which is why the old check only ever worked on a fresh cluster.
      test: ["CMD-SHELL", "hdfs dfsadmin -fs hdfs://namenode:9000 -report 2>/dev/null | grep -q 'Configured Capacity'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  datanode:
    image: apache/hadoop:3
    container_name: resellradar-datanode
    hostname: datanode
    user: root
    command: ["/bin/bash", "-c", "hdfs datanode"]
    environment:
      EFS_NAME: HDFS
    ports:
      - "9864:9864"   # DataNode Web UI
    volumes:
      - hdfs_datanode:/hadoop/dfs/data
      - ./docker/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./docker/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    depends_on:
      namenode:
        condition: service_healthy

  # ---- Spark Standalone batch cluster (profile "cluster") --------------------
  # Same image as the execution harness (numpy included); sizing fits the Docker
  # Desktop VM (16 CPU / ~7.6 GB RAM shared with the two Hadoop JVMs):
  #   3 workers x 3 cores, 1 GB executor heap each, 512 MB master, 1.5 GB driver.
  spark-master:
    image: resellradar/spark:4.2.0-numpy
    build: ./docker/spark
    container_name: resellradar-spark-master
    hostname: spark-master
    user: root
    command: ["/bin/bash", "-c", "SPARK_NO_DAEMONIZE=1 /opt/spark/sbin/start-master.sh -h spark-master"]
    environment:
      SPARK_DAEMON_MEMORY: 512m
    ports:
      - "8080:8080"   # Spark Master Web UI (shows workers + running applications)
    profiles: ["cluster"]

  spark-worker:
    image: resellradar/spark:4.2.0-numpy
    build: ./docker/spark
    user: root
    command: ["/bin/bash", "-c", "SPARK_NO_DAEMONIZE=1 /opt/spark/sbin/start-worker.sh spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: "3"
      SPARK_WORKER_MEMORY: 3g
      SPARK_DAEMON_MEMORY: 256m
    volumes:
      - ./:/work:ro   # executors import the job modules shipped by the driver
    depends_on:
      - spark-master
    profiles: ["cluster"]

volumes:
  hdfs_namenode:
  hdfs_datanode:
